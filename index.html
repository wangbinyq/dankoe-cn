const ORIGIN = 'https://letters.thedankoe.com/p/';
const list = document.getElementById('list');
const q = document.getElementById('q');
const f = document.getElementById('f');
let onlyDone = false;

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function render(){
  const term = q.value.trim().toLowerCase();
  const rows = DATA.filter(it => {
    if (onlyDone && !it.done) return false;
    if (!term) return true;
    return (it.zh + ' ' + it.en + ' ' + it.summary).toLowerCase().includes(term);
  });
  if (!rows.length){ list.innerHTML = '<div class="empty">没有匹配的文章</div>'; return; }
  let out = '', year = '';
  for (const it of rows){
    const y = it.date.slice(0,4);
    if (y !== year){ year = y; out += '<div class="year">' + y + '</div>'; }
    const tags = (it.done ? '<span class="tag done">已译</span>' : '<span class="tag wait">待译</span>')
      + (it.paid ? '<span class="tag paid">付费</span>' : '');
    out += '<button class="item" data-slug="' + esc(it.slug) + '">'
      + '<div class="row"><h2>' + esc(it.zh) + '</h2><span class="meta">' + it.date.slice(5) + ' · ' + it.words + ' 词</span></div>'
      + '<p>' + tags + esc(it.summary) + '</p></button>';
  }
  list.innerHTML = out;
}

list.addEventListener('click', e => {
  const el = e.target.closest('.item');
  if (!el) return;
  const it = DATA.find(x => x.slug === el.dataset.slug);
  if (it) open(it);
});

const reader = document.getElementById('reader');
const rt = document.getElementById('rt');
const rbody = document.getElementById('rbody');
const rl = document.getElementById('rl');
let artStyle = null;
let loadToken = 0;

function clearBody(){
  rbody.innerHTML = '';
  if (artStyle && artStyle.parentNode) artStyle.parentNode.removeChild(artStyle);
  artStyle = null;
  rbody.scrollTop = 0;
}

function notice(title, text, kind){
  rbody.innerHTML = '<div class="loading"><p style="color:var(--accent);font-size:13px;letter-spacing:.15em;margin:0 0 12px">' + kind + '</p>'
    + '<p style="font-size:17px;color:var(--ink);margin:0 0 10px">' + esc(title) + '</p>'
    + '<p style="margin:0">' + esc(text) + '</p></div>';
}

async function open(it){
  rt.textContent = it.zh;
  rl.href = ORIGIN + it.slug;
  reader.classList.add('on');
  document.body.style.overflow = 'hidden';
  window.scrollTo(0, 0);
  history.replaceState(null, '', '#' + it.slug);
  clearBody();
  const token = ++loadToken;
  if (it.ext){
    notice(it.zh, it.ext, '已译');
    return;
  }
  if (!it.done){
    notice(it.zh, it.summary + ' —— 这篇还没有译文，点右上角「原文」读英文版。', '待译');
    return;
  }
  rbody.innerHTML = '<div class="loading">载入中…</div>';
  try {
    const res = await fetch(it.file);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (token !== loadToken) return;
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const styleEl = doc.querySelector('style');
    const art = doc.querySelector('article') || doc.body;
    rbody.innerHTML = '';
    if (styleEl){
      artStyle = document.createElement('style');
      artStyle.textContent = styleEl.textContent;
      document.head.appendChild(artStyle);
    }
    rbody.appendChild(document.adoptNode(art));
    rbody.scrollTop = 0;
  } catch (e) {
    if (token !== loadToken) return;
    notice(it.zh, '载入失败：' + e.message, '错误');
  }
}

document.getElementById('close').onclick = () => {
  reader.classList.remove('on');
  document.body.style.overflow = '';
  loadToken++;
  clearBody();
  history.replaceState(null, '', location.pathname);
};

q.addEventListener('input', render);
f.onclick = () => {
  onlyDone = !onlyDone;
  f.setAttribute('aria-pressed', String(onlyDone));
  render();
};

render();

if (location.hash.length > 1){
  const it = DATA.find(x => x.slug === location.hash.slice(1));
  if (it) open(it);
}

window.onerror = function(msg){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:#a8442a;color:#fff;font-size:13px;z-index:99';
  d.textContent = '页面出错：' + msg;
  document.body.appendChild(d);
};
</script>
